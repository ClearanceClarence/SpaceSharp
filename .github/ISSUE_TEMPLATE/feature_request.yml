name: Feature request
description: Suggest something SpaceSharp should do, or do better.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Describing the problem you're trying to solve helps more than a specific solution, since there may be a simpler way to get there.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or task where SpaceSharp falls short today.
      placeholder: I want to find installers I downloaded more than a year ago and never ran, but there's no way to see when a file was last opened.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like SpaceSharp to do?
      description: Your idea for how it could work. Rough is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
      description: Workarounds, other tools, or "I don't".

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app is this about?
      options:
        - Scanning and accuracy
        - The map (layout, styles, colors, labels)
        - Zoom and navigation
        - Filter and search
        - Side panel (drives, largest items)
        - Deleting and cleanup
        - Settings and appearance
        - Installer and updates
        - Something else

  - type: textarea
    id: mockup
    attributes:
      label: Sketches or examples
      description: A drawing, a screenshot from another tool, or a mockup, if you have one.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions for this idea

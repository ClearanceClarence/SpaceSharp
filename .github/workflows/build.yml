name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx

      - name: Publish portable exe
        run: dotnet publish .\SpaceSharp\SpaceSharp.csproj -p:PublishProfile=Portable

      - name: Upload portable exe
        uses: actions/upload-artifact@v7
        with:
          name: SpaceSharp-portable-${{ github.sha }}
          path: publish/portable/SpaceSharp.exe

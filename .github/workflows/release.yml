# Builds every release asset when a version tag is pushed and opens a draft
# release with the changelog section as its notes. Review the draft, then publish.
#
#   git tag 1.2.1
#   git push origin 1.2.1

name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    name: Package and draft release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Check that the project version matches the tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $csproj = Get-Content .\SpaceSharp\SpaceSharp.csproj -Raw
          if ($csproj -notmatch '<Version>([^<]+)</Version>') { throw "No <Version> in SpaceSharp.csproj" }
          $version = $Matches[1]
          if ($version -ne $tag) { throw "Tag $tag does not match <Version>$version</Version> in SpaceSharp.csproj" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish portable exe
        run: dotnet publish .\SpaceSharp\SpaceSharp.csproj -p:PublishProfile=Portable

      - name: Publish folder for Velopack
        run: dotnet publish .\SpaceSharp\SpaceSharp.csproj -p:PublishProfile=Velopack

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Download the previous release (for delta packages)
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack installers
        shell: pwsh
        run: >-
          vpk pack
          --packId SpaceSharp
          --packVersion $env:VERSION
          --packDir .\publish\velopack
          --mainExe SpaceSharp.exe
          --packTitle SpaceSharp
          --packAuthors ClearanceClarence
          --icon .\SpaceSharp\Assets\SpaceSharp.ico
          --splashImage .\SpaceSharp\Assets\SpaceSharp-256.png
          --msi
          --instLocation Either
          --instWelcome .\installer\welcome.md
          --instLicense .\installer\license.txt
          --instConclusion .\installer\conclusion.md
          --msiBanner .\installer\banner.bmp
          --msiLogo .\installer\logo.bmp

      - name: Brand the MSI
        if: hashFiles('installer/brand-msi.ps1') != ''
        shell: pwsh
        run: .\installer\brand-msi.ps1

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $lines = Get-Content .\CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## $env:VERSION\b" | Select-Object -First 1).LineNumber
          if (-not $start) { throw "CHANGELOG.md has no '## $env:VERSION' section" }
          $body = @()
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## ') { break }
            $body += $lines[$i]
          }
          $body -join "`n" | Set-Content -Path release-notes.md -Encoding utf8

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: SpaceSharp ${{ env.VERSION }}
          body_path: release-notes.md
          draft: true
          files: |
            Releases/*
            publish/portable/SpaceSharp.exe
